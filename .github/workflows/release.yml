name: release

# Build the mcpshield-runtime CLI for each supported platform on every version
# tag and attach the archives to the GitHub Release for that tag, so users can
# `cargo install` or download a prebuilt binary as the quickstart promises.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and upload binaries for'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  upload-binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # Builds the binary for the target (installing a cross linker when needed),
      # packages it as a .tar.gz, and uploads it to the tag's GitHub Release.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mcpshield-runtime
          target: ${{ matrix.target }}
          archive: mcpshield-runtime-$target
          tar: unix
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
