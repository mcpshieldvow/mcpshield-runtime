[workspace]
members = [
    "crates/mcpshield-runtime",
    "crates/mcpshield-policy",
    "crates/mcpshield-telemetry",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mcpshieldvow/mcpshield-runtime"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hmac = "0.13"
sha2 = "0.11"
anyhow = "1"
thiserror = "2"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
mcpshield-policy = { path = "crates/mcpshield-policy" }
mcpshield-telemetry = { path = "crates/mcpshield-telemetry" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
